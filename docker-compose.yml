services:
  app:
    build: .
    container_name: log_service
    restart: unless-stopped

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/logs_db
      LOG_RETENTION_ENABLED: "true"
      LOG_RETENTION_DAYS: 30
      RETENTION_CLEANUP_INTERVAL_MS: 900000
      RETENTION_DELETE_BATCH_SIZE: 5000
      RETENTION_MAX_BATCHES_PER_RUN: 20
      MAX_LOGS_PER_BATCH: 10000
      INSERT_CHUNK_SIZE: 5000
      INGEST_FLUSH_CONCURRENCY: 4
      DB_POOL_MAX: 10
      MAX_SERVICE_LENGTH: 256
      MAX_MESSAGE_LENGTH: 8192
      MAX_ATTRIBUTES_PER_LOG: 50
      MAX_ATTRIBUTE_KEY_LENGTH: 128
      MAX_ATTRIBUTE_STRING_VALUE_LENGTH: 4096

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    cpus: 0.5
    mem_limit: 256m

  postgres:
    image: postgres:16
    container_name: log_postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

    cpus: 1.0
    mem_limit: 1g

volumes:
  postgres_data:
